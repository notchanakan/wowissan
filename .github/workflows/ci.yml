name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Includes the check that .agents/skills/issanmode/SKILL.md matches the hook ruleset.
      - run: node --test tests/
